<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="../support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="../_ds/realty-hub-design-system-dc2b1855-61ad-4be7-8677-8c19514f7cae/styles.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root { --rh-font: 'Montserrat', system-ui, sans-serif; --rh-accent: #1a1a1a; --rh-accent-hover: #000000; }
    @keyframes modal-fade-in { from { opacity: 0; } to { opacity: 1; } }
    @keyframes modal-fade-out { from { opacity: 1; } to { opacity: 0; } }
    @keyframes modal-scale-in { from { opacity: 0; transform: scale(0.96) translateY(8px); } to { opacity: 1; transform: scale(1) translateY(0); } }
    @keyframes modal-scale-out { from { opacity: 1; transform: scale(1) translateY(0); } to { opacity: 0; transform: scale(0.96) translateY(8px); } }
    @keyframes rhDropdownFade { from { opacity: 0; transform: translateY(-4px); } to { opacity: 1; transform: translateY(0); } }
  </style>
</helmet>

<sc-if value="{{ isContactModalVisible }}" hint-placeholder-val="{{ false }}">
  <div style="position: fixed; inset: 0; z-index: 350; background: #000000; overflow-y: auto; animation: {{ contactModalOverlayAnimation }};">
    <div style="position: absolute; inset: 0; background-image: url('../uploads/Pinnacles.png'); background-size: cover; background-position: center;"></div>
    <div style="position: absolute; inset: 0; background: linear-gradient(180deg, rgba(0,0,0,0.72) 0%, rgba(0,0,0,0.82) 100%);"></div>
    <button onClick="{{ closeContactModal }}" aria-label="Close" style="position: fixed; top: 24px; right: clamp(20px, 4vw, 40px); background: none; border: none; font-size: 32px; line-height: 1; cursor: pointer; color: #ffffff; z-index: 2; transition: opacity 0.2s ease;" style-hover="opacity: 0.6;">×</button>
    <div style="position: relative; z-index: 1; min-height: 100%; display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 56px; max-width: 1200px; margin: 0 auto; padding: clamp(72px, 10vh, 120px) clamp(24px, 6vw, 64px) 64px; animation: {{ contactModalCardAnimation }};">
      <div style="border-right: 1px solid rgba(255,255,255,0.18); padding-right: clamp(0px, 4vw, 48px);">
        <h2 style="font-size: clamp(26px, 3.6vw, 38px); font-weight: 600; color: #ffffff; margin: 0 0 32px; letter-spacing: -0.01em;">Contact Details</h2>
        <div style="display: flex; flex-direction: column; gap: 36px; font-size: 15px; color: rgba(255,255,255,0.85);">
          <div>
            <div style="font-size: 13px; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; color: rgba(255,255,255,0.55); margin-bottom: 10px;">Phone</div>
            <a href="tel:+18318210398" style="color: #ffffff; text-decoration: none; font-size: 22px;">(831) 821-0398</a>
          </div>
          <div>
            <div style="font-size: 13px; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; color: rgba(255,255,255,0.55); margin-bottom: 10px;">Email</div>
            <a href="mailto:jackson@kesecker.co" style="color: #ffffff; text-decoration: none; font-size: 22px;">jackson@kesecker.co</a>
          </div>
          <div style="display: flex; flex-direction: column; gap: 36px;">
            <div>
              <div style="font-size: 13px; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; color: rgba(255,255,255,0.55); margin-bottom: 10px;">Salinas Office</div>
              <a href="https://www.google.com/maps/search/?api=1&query=1368+South+Main+Street+Suite+B+Salinas+CA+93901" target="_blank" rel="noopener" onMouseEnter="{{ hoverSalinasOffice }}" onMouseLeave="{{ unhoverOffice }}" style="color: #ffffff; display: inline-block; font-size: 19px; line-height: 1.5; {{ salinasAddressStyle }}">1368 South Main Street<br>Suite B<br>Salinas, CA 93901</a>
            </div>
            <div>
              <div style="font-size: 13px; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; color: rgba(255,255,255,0.55); margin-bottom: 10px;">Carmel Office</div>
              <a href="https://www.google.com/maps/search/?api=1&query=26135+Carmel+Rancho+Boulevard+Suite+F200+Carmel+CA+93923" target="_blank" rel="noopener" onMouseEnter="{{ hoverCarmelOffice }}" onMouseLeave="{{ unhoverOffice }}" style="color: #ffffff; display: inline-block; font-size: 19px; line-height: 1.5; {{ carmelAddressStyle }}">26135 Carmel Rancho Boulevard<br>Suite F200<br>Carmel, CA 93923</a>
            </div>
          </div>
        </div>
      </div>
      <div>
        <h2 style="font-size: clamp(26px, 3.6vw, 38px); font-weight: 600; color: #ffffff; margin: 0 0 32px; letter-spacing: -0.01em;">Submit a Message</h2>
        <form onSubmit="{{ handleContactSubmit }}" style="display: flex; flex-direction: column; gap: 22px;">
          <div style="display: flex; flex-direction: column; gap: 6px;">
            <label style="font-size: 11px; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; color: rgba(255,255,255,0.55);">Full Name *</label>
            <input type="text" required="{{ true }}" style="width: 100%; box-sizing: border-box; padding: 8px 2px; font-size: 15px; font-family: var(--rh-font); color: #ffffff; background: transparent; border: none; border-bottom: 1px solid rgba(255,255,255,0.3); outline: none; transition: border-color 0.2s ease;" style-focus="border-bottom-color: #ffffff;">
          </div>
          <div style="display: flex; flex-direction: column; gap: 6px;">
            <label style="font-size: 11px; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; color: rgba(255,255,255,0.55);">Email *</label>
            <input type="email" required="{{ true }}" style="width: 100%; box-sizing: border-box; padding: 8px 2px; font-size: 15px; font-family: var(--rh-font); color: #ffffff; background: transparent; border: none; border-bottom: 1px solid rgba(255,255,255,0.3); outline: none; transition: border-color 0.2s ease;" style-focus="border-bottom-color: #ffffff;">
          </div>
          <div style="display: flex; flex-direction: column; gap: 6px;">
            <label style="font-size: 11px; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; color: rgba(255,255,255,0.55);">Phone *</label>
            <input type="tel" required="{{ true }}" style="width: 100%; box-sizing: border-box; padding: 8px 2px; font-size: 15px; font-family: var(--rh-font); color: #ffffff; background: transparent; border: none; border-bottom: 1px solid rgba(255,255,255,0.3); outline: none; transition: border-color 0.2s ease;" style-focus="border-bottom-color: #ffffff;">
          </div>
          <div style="display: flex; flex-direction: column; gap: 6px; position: relative;">
            <label style="font-size: 11px; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; color: rgba(255,255,255,0.55);">What are you interested in?</label>
            <sc-if value="{{ modalInterestOpen }}" hint-placeholder-val="{{ false }}">
              <div onClick="{{ closeModalInterestOpen }}" style="position: fixed; inset: 0; z-index: 4; background: transparent;"></div>
            </sc-if>
            <div onClick="{{ toggleModalInterestOpen }}" style="width: 100%; box-sizing: border-box; padding: 0 2px 8px; font-size: 15px; font-family: var(--rh-font); color: #ffffff; background: transparent; border: none; border-bottom: 1px solid rgba(255,255,255,0.3); cursor: pointer; display: flex; align-items: center; justify-content: space-between; position: relative; z-index: 5; {{ modalInterestTriggerStyle }}">
              <span>{{ modalInterestSelectedLabel }}</span>
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="transition: transform 0.2s ease; {{ modalInterestChevronStyle }}"><path d="M6 9l6 6 6-6"></path></svg>
            </div>
            <sc-if value="{{ modalInterestOpen }}" hint-placeholder-val="{{ false }}">
              <div style="position: absolute; top: calc(100% + 6px); left: 0; right: 0; background: #1a1a1a; border: 1px solid rgba(255,255,255,0.2); box-shadow: 0 12px 28px rgba(0,0,0,0.4); z-index: 6; overflow: hidden; animation: rhDropdownFade 0.16s ease;">
                <sc-for list="{{ modalInterestOptions }}" as="opt" hint-placeholder-count="3">
                  <div onClick="{{ opt.onSelect }}" style="padding: 11px 12px; font-size: 15px; font-family: var(--rh-font); color: #ffffff; cursor: pointer; transition: background 0.15s ease; {{ opt.textStyle }}" style-hover="background: rgba(255,255,255,0.1);">{{ opt.label }}</div>
                </sc-for>
              </div>
            </sc-if>
          </div>
          <div style="display: flex; flex-direction: column; gap: 6px;">
            <label style="font-size: 11px; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; color: rgba(255,255,255,0.55);">Message *</label>
            <textarea required="{{ true }}" rows="4" style="width: 100%; box-sizing: border-box; padding: 12px 16px; font-size: 15px; font-family: var(--rh-font); color: #ffffff; background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.3); resize: vertical;"></textarea>
          </div>
          <button type="submit" style="width: 100%; padding: 14px; font-size: 14px; font-weight: 600; letter-spacing: 0.04em; text-transform: uppercase; font-family: var(--rh-font); color: #1a1a1a; background: #ffffff; border: none; cursor: pointer; transition: opacity 0.2s ease;" style-hover="opacity: 0.85;">Send Message</button>
        </form>
      </div>
    </div>
  </div>
</sc-if>
</x-dc>
<script type="text/x-dc" data-dc-script>
class Component extends DCLogic {
  state = { isContactModalVisible: false, isContactModalClosing: false, modalInterestIndex: 0, modalInterestOpen: false, hoveredOffice: null };
  interestOptionsList = ['Buying', 'Selling', 'Other'];
  componentDidMount() {
    window.openKeseckerContactModal = () => this.setState({ isContactModalVisible: true, isContactModalClosing: false });
  }
  componentWillUnmount() {
    if (window.openKeseckerContactModal) delete window.openKeseckerContactModal;
  }
  closeContactModal = () => {
    this.setState({ isContactModalClosing: true });
    setTimeout(() => this.setState({ isContactModalVisible: false, isContactModalClosing: false }), 300);
  };
  setOfficeHover = (which) => this.setState({ hoveredOffice: which });
  toggleModalInterestOpen = () => this.setState(s => ({ modalInterestOpen: !s.modalInterestOpen }));
  closeModalInterestOpen = () => this.setState({ modalInterestOpen: false });
  selectInterest = (i) => this.setState({ modalInterestIndex: i, modalInterestOpen: false });
  renderVals() {
    return {
      isContactModalVisible: this.state.isContactModalVisible,
      closeContactModal: this.closeContactModal,
      contactModalOverlayAnimation: this.state.isContactModalClosing ? 'modal-fade-out 0.3s ease forwards' : 'modal-fade-in 0.35s ease',
      contactModalCardAnimation: this.state.isContactModalClosing ? 'modal-scale-out 0.3s ease forwards' : 'modal-scale-in 0.35s ease',
      handleContactSubmit: (e) => { e.preventDefault(); },
      hoverSalinasOffice: () => this.setOfficeHover('salinas'),
      hoverCarmelOffice: () => this.setOfficeHover('carmel'),
      unhoverOffice: () => this.setOfficeHover(null),
      salinasAddressStyle: this.state.hoveredOffice === 'salinas' ? 'text-decoration: underline; text-decoration-color: #ffffff; text-underline-offset: 3px;' : 'text-decoration: none;',
      carmelAddressStyle: this.state.hoveredOffice === 'carmel' ? 'text-decoration: underline; text-decoration-color: #ffffff; text-underline-offset: 3px;' : 'text-decoration: none;',
      modalInterestOpen: this.state.modalInterestOpen,
      toggleModalInterestOpen: this.toggleModalInterestOpen,
      closeModalInterestOpen: this.closeModalInterestOpen,
      modalInterestSelectedLabel: this.interestOptionsList[this.state.modalInterestIndex],
      modalInterestTriggerStyle: this.state.modalInterestOpen ? 'border-bottom-color: #ffffff;' : '',
      modalInterestChevronStyle: this.state.modalInterestOpen ? 'transform: rotate(180deg);' : 'transform: rotate(0deg);',
      modalInterestOptions: this.interestOptionsList.map((label, i) => ({
        label,
        onSelect: () => this.selectInterest(i),
        textStyle: i === this.state.modalInterestIndex
          ? 'text-decoration: underline; text-decoration-color: #ffffff; text-decoration-thickness: 2px; text-underline-offset: 3px; font-weight: 600;'
          : 'text-decoration: none; font-weight: 400;',
      })),
    };
  }
}
</script>
</body>
</html>
