<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha384-sHL9NAb7lN7rfvG5lfHpm643Xkcjzp4jFvuavGOndn6pjVqS6ny56CAt3nsEVT4H" crossorigin="anonymous">
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha384-cxOPjt7s7Iz04uaHJceBmS+qpjv2JkIHNVcuOrM+YHwZOmJGBXI00mdUXEq65HTH" crossorigin="anonymous"></script>
<style>
  html, body, #map { margin: 0; padding: 0; width: 100%; height: 100%; }
  #status { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; font-family: Montserrat, system-ui, sans-serif; font-size: 14px; color: #666; background: #f4f4f4; }
</style>
</head>
<body>
<div id="status">Loading map…</div>
<div id="map" style="display:none;"></div>
<script>
  const params = new URLSearchParams(location.search);
  const address = params.get('address') || '';
  const statusEl = document.getElementById('status');
  const mapEl = document.getElementById('map');
  if (!address) {
    statusEl.textContent = 'No address provided.';
  } else {
    fetch('https://nominatim.openstreetmap.org/search?format=json&limit=1&q=' + encodeURIComponent(address))
      .then((r) => r.json())
      .then((results) => {
        if (!results || !results.length) { statusEl.textContent = 'Location not found.'; return; }
        const lat = parseFloat(results[0].lat);
        const lon = parseFloat(results[0].lon);
        statusEl.style.display = 'none';
        mapEl.style.display = 'block';
        const map = L.map('map', { scrollWheelZoom: false }).setView([lat, lon], 15);
        L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
          attribution: '&copy; OpenStreetMap contributors',
        }).addTo(map);
        L.marker([lat, lon]).addTo(map).bindPopup(address).openPopup();
      })
      .catch(() => { statusEl.textContent = 'Map unavailable.'; });
  }
</script>
</body>
</html>
