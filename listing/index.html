  _ihfFixTextInRoot = (root) => {
    const cityStateZipRe = /^([A-Za-z .'-]+),\s*([A-Z]{2})\s*(\d{5})$/;

      if (cz && trimmed === trimmed.toUpperCase()) {

        if (full) { changed = true; return full; }
        return word;
      });
      if (changed) node.nodeValue = fixedText;

    const ihfDirectText = (el) => { let s = ''; el.childNodes.forEach((n) => { if (n.nodeType === 3) s += n.nodeValue; }); return s.trim(); };

        + ".MuiOutlinedInput-root, .MuiOutlinedInput-root:hover, .MuiOutlinedInput-root.Mui-focused, .MuiFilledInput-root, .MuiFilledInput-root:hover, .MuiFilledInput-root.Mui-focused, .MuiInputBase-root, .MuiInputBase-root:hover, .MuiInputBase-root.Mui-focused { background-color: transparent !important; background: transparent !important; transition: border-bottom-color 0.3s ease; }"

    let clone = root.querySelector('[data-ihf-results-clone]');
    if (!clone) {
      clone = document.createElement('span');
      clone.setAttribute('data-ihf-results-clone', '1');
      clone.style.marginLeft = '12px';
      clone.style.fontSize = '14px';
      clone.style.color = 'inherit';
      clone.style.fontFamily = 'inherit';
      clone.style.whiteSpace = 'nowrap';
    }
    const t = directText(resultsEl);
    if (clone.textContent !== t) clone.textContent = t;
    if (clone.parentElement !== mapEl.parentElement || clone.previousElementSibling !== mapEl) {
      mapEl.parentElement.insertBefore(clone, mapEl.nextSibling);
    }
  };
  _ihfTraceHearts = (root) => {
    root.querySelectorAll('.ihf-listing-result-badge-fav').forEach((btn) => {
      if (btn.dataset.heartTraced) return;
      const svg = btn.querySelector('svg');
      if (!svg || !svg.querySelector('path')) return;
      btn.dataset.heartTraced = '1';
      if (getComputedStyle(btn).position === 'static') btn.style.position = 'relative';
      const clone = svg.cloneNode(true);
      clone.classList.add('heart-trace-clone');
      clone.style.position = 'absolute';
      clone.style.inset = '0';
      clone.style.pointerEvents = 'none';
      clone.style.overflow = 'visible';
      clone.querySelectorAll('path').forEach((p) => {
        let len = 40;
        try { len = p.getTotalLength(); } catch (e) {}
        p.style.fill = 'none';
        p.style.stroke = '#e53935';
        p.style.strokeWidth = '2';
        p.style.strokeDasharray = String(len);
        p.style.strokeDashoffset = String(len);
      });
      svg.insertAdjacentElement('afterend', clone);
    });
  };
  _ihfFixCloseButtons = (root) => {
    root.querySelectorAll('.MuiIconButton-root').forEach((btn) => {
      if (btn._ihfCloseHoverBound) return;
      const svg = btn.querySelector('svg');
      if (!svg || !svg.querySelector('line')) return;
      btn._ihfCloseHoverBound = true;
      btn.addEventListener('mouseenter', () => { svg.style.setProperty('color', '#999999', 'important'); svg.querySelectorAll('line').forEach((l) => l.style.setProperty('stroke', '#999999', 'important')); });
      btn.addEventListener('mouseleave', () => { svg.style.removeProperty('color'); svg.querySelectorAll('line').forEach((l) => l.style.removeProperty('stroke')); });
    });
  };
  _ihfFixAllShadowRoots = () => {
    try { this._ihfFixTextInRoot(document); } catch (e) {}
    try { this._ihfFixCloseButtons(document); } catch (e) {}
    document.querySelectorAll('*').forEach((el) => {
      if (el.shadowRoot) { try { this._ihfFixTextInRoot(el.shadowRoot); } catch (e) {} try { this._ihfFixCloseButtons(el.shadowRoot); } catch (e) {} }
    });
  };
  _ihfStartCaseFix = () => {
    if (this._ihfCaseFixStarted) return;
    this._ihfCaseFixStarted = true;
    if (!document.getElementById('ihf-modal-fix')) {
      const s = document.createElement('style');
      s.id = 'ihf-modal-fix';
      s.textContent = "div.ihf-overlay-container { position: fixed !important; top: 0 !important; left: 0 !important; }"
        + ".ui-typography-h3 { text-align: center !important; font-size: 22px !important; }"
        + ".ui-typography-body1 { text-align: center !important; font-size: 14px !important; }"
        + ".ui-outlined-input { border: none !important; border-bottom: 1px solid #cccccc !important; border-radius: 0 !important; box-shadow: none !important; padding-left: 4px !important; }"
        + ".ui-outlined-input-input { font-size: 14px !important; padding: 8px 4px !important; }"
        + ".ui-outlined-input fieldset { border: none !important; }"
        + ".ihf-email-field, .ui-form-control { max-width: 320px !important; margin-left: auto !important; margin-right: auto !important; }"
        + "[aria-label*='close' i], button[aria-label*='close' i] svg, .MuiDialog-root [aria-label*='close' i], .MuiModal-root [aria-label*='close' i] { transition: color 0.2s ease, opacity 0.2s ease !important; }"
        + "[aria-label*='close' i]:hover, button[aria-label*='close' i]:hover svg, .MuiDialog-root [aria-label*='close' i]:hover, .MuiModal-root [aria-label*='close' i]:hover { color: #999999 !important; fill: #999999 !important; opacity: 0.65 !important; }"
        + ".MuiDialog-root .MuiIconButton-root, .MuiModal-root .MuiIconButton-root, .MuiDialog-root button svg, .MuiModal-root button svg { transition: color 0.2s ease, opacity 0.2s ease, fill 0.2s ease !important; }"
        + ".MuiDialog-root .MuiIconButton-root:hover, .MuiModal-root .MuiIconButton-root:hover, .MuiDialog-root button:hover svg, .MuiModal-root button:hover svg { color: #999999 !important; fill: #999999 !important; opacity: 0.65 !important; }"
        + ".MuiDialog-paper .MuiIconButton-root svg, .MuiDialog-paper .MuiIconButton-root svg line { transition: color 0.2s ease, stroke 0.2s ease, opacity 0.2s ease !important; }"
        + ".MuiDialog-paper .MuiIconButton-root:hover svg, .MuiDialog-paper .MuiIconButton-root:hover svg line { color: #999999 !important; stroke: #999999 !important; opacity: 0.65 !important; }";
      document.head.appendChild(s);
    }
    if (!this._ihfMo) {
      this._ihfMo = new MutationObserver(() => this._ihfFixAllShadowRoots());
      this._ihfMo.observe(document.body, { childList: true, subtree: true });
    }
    this._ihfFixAllShadowRoots();
  };
  ihfListingDetailRef = (node) => {
    if (!node || node.dataset.ihfMounted) return;
    const doMount = () => {
      if (node.dataset.ihfMounted) return;
      node.dataset.ihfMounted = '1';
      node.appendChild(window.ihfKestrel.render());
      this._ihfStartCaseFix();
    };
    if (window.ihfKestrel && window.ihfKestrel.render) { doMount(); return; }
    const ks = document.querySelector('script[src*="ihf-kestrel.js"]');
    if (ks) ks.addEventListener('load', doMount, { once: true });
  };
  openContactModal = (e) => { if (e) e.preventDefault(); if (window.openKeseckerContactModal) window.openKeseckerContactModal(); };
  togglePhonePopup = () => this.setState(s => ({ isPhoneOpen: !s.isPhoneOpen }));
  onPhoneClose = () => this.setState({ isPhoneOpen: false });
  renderVals() {
    return {
      ihfListingDetailRef: this.ihfListingDetailRef,
      openContactModal: this.openContactModal,
      isPhoneOpen: this.state.isPhoneOpen, togglePhonePopup: this.togglePhonePopup, onPhoneClose: this.onPhoneClose,
      phonePopoverStyle: this.state.isPhoneOpen ? 'opacity:1;visibility:visible;transform:translateY(0);transition:opacity 0.3s ease,transform 0.3s ease;' : 'opacity:0;visibility:hidden;transform:translateY(8px);transition:opacity 0.3s ease,transform 0.3s ease;',
    };
  }
}

</script>
</body>
</html>
