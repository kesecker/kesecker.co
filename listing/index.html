<script type="text/x-dc" data-dc-script>
class Component extends DCLogic {
  state = { isPhoneOpen: false };
  _ihfStreetSuffixes = { RD:'Road', ST:'Street', AVE:'Avenue', DR:'Drive', LN:'Lane', CT:'Court', WAY:'Way', BLVD:'Boulevard', PL:'Place', CIR:'Circle', TER:'Terrace', PKWY:'Parkway', HWY:'Highway', LOOP:'Loop', TRL:'Trail', SQ:'Square' };
  _ihfFixGalleryModal = (root) => {
    const paper = root.querySelector('[role="dialog"]');
    if (paper && !paper.dataset.ihfGalleryFixed && paper.className && /MuiDialog-paper/.test(paper.className)) {
      paper.dataset.ihfGalleryFixed = '1';
      paper.style.setProperty('overflow-y', 'auto', 'important');
      paper.style.setProperty('max-height', 'calc(100vh - 64px)', 'important');
    }
    if (paper) {
      Array.from(paper.querySelectorAll('*')).forEach((el) => {
        if (el.style && /^\d+%$/.test(el.style.width) && parseInt(el.style.width, 10) < 100) {
          el.style.setProperty('width', '100%', 'important');
        }
      });
      const findSmallestMatch = (text) => {
        const matches = Array.from(root.querySelectorAll('*')).filter((el) => (el.textContent || '').trim() === text);
        if (!matches.length) return null;
        return matches.reduce((a, b) => (a.querySelectorAll('*').length <= b.querySelectorAll('*').length ? a : b));
      };
      const backLink = findSmallestMatch('Back to listing') || Array.from(root.querySelectorAll('*')).find((el) => /back to listing/i.test((el.textContent || '').trim()));
      const shareLeaf = findSmallestMatch('Share');
      const scheduleBtn = findSmallestMatch('Schedule Tour') || Array.from(root.querySelectorAll('*')).find((el) => /schedule tour/i.test((el.textContent || '').trim()));
      if (backLink && shareLeaf && scheduleBtn) {
        let topBar = backLink;
        for (let i = 0; i < 8 && topBar.parentElement && !topBar.contains(shareLeaf); i++) topBar = topBar.parentElement;
        let sidebar = scheduleBtn;
        for (let i = 0; i < 8 && sidebar.parentElement; i++) {
          sidebar = sidebar.parentElement;
          const pos = getComputedStyle(sidebar).position;
          if (pos === 'fixed' || pos === 'sticky') break;
        }
        const sidebarAnchor = sidebar && sidebar.parentElement;
        const commonParent = sidebarAnchor && sidebarAnchor.parentElement;
        const photoCol = commonParent ? Array.from(commonParent.children).find((c) => c !== sidebarAnchor) : null;
        if (topBar && topBar.contains(shareLeaf) && sidebar && sidebarAnchor && commonParent && photoCol) {
          topBar.style.setProperty('display', 'none', 'important');
          sidebarAnchor.style.setProperty('display', 'none', 'important');
          commonParent.style.setProperty('display', 'block', 'important');
          commonParent.style.setProperty('width', '100%', 'important');
          commonParent.style.setProperty('padding', '0', 'important');
          photoCol.style.setProperty('width', '100%', 'important');
          photoCol.style.setProperty('max-width', 'none', 'important');
          photoCol.style.setProperty('box-sizing', 'border-box', 'important');
          photoCol.style.setProperty('padding', '0 24px', 'important');
          photoCol.style.setProperty('margin', '0 auto', 'important');
          paper.style.setProperty('padding', '0', 'important');
          paper.style.setProperty('width', 'calc(100vw - 48px)', 'important');
          paper.style.setProperty('max-width', 'calc(100vw - 48px)', 'important');
          paper.style.setProperty('margin', '24px', 'important');
          if (!photoCol.dataset.ihfPadMatched) {
            const firstChild = photoCol.firstElementChild;
            if (firstChild) {
              const topGap = firstChild.getBoundingClientRect().top - photoCol.getBoundingClientRect().top;
              if (topGap > 0) {
                photoCol.dataset.ihfPadMatched = '1';
                photoCol.style.setProperty('padding-bottom', topGap + 'px', 'important');
              }
            }
          }
          if (!paper.dataset.ihfGalleryHeaderAdded) {
            paper.dataset.ihfGalleryHeaderAdded = '1';
            const header = document.createElement('div');
            header.style.cssText = 'position: sticky; top: 0; z-index: 10000; display: flex; align-items: center; justify-content: center; height: 92px; background: #000000; flex-shrink: 0;';
            const logo = document.createElement('img');
            logo.src = 'uploads/JKR-key-white.png';
            logo.alt = 'Jackson Kesecker Realtor';
            logo.style.cssText = 'height: 34px; width: auto;';
            header.appendChild(logo);
            const closeBtn = document.createElement('button');
            closeBtn.setAttribute('aria-label', 'Close');
            closeBtn.innerHTML = '&times;';
            closeBtn.style.cssText = 'position: absolute; top: 50%; right: clamp(20px, 4vw, 40px); transform: translateY(-50%); background: none; border: none; font-size: 32px; line-height: 1; cursor: pointer; color: #ffffff; padding: 0; transition: opacity 0.2s ease;';
            closeBtn.addEventListener('mouseenter', () => { closeBtn.style.opacity = '0.6'; });
            closeBtn.addEventListener('mouseleave', () => { closeBtn.style.opacity = '1'; });
            closeBtn.addEventListener('click', () => { backLink.click(); });
            header.appendChild(closeBtn);
            paper.insertBefore(header, paper.firstChild);
          }
        }
      }
    }
  };
  _ihfFixTextInRoot = (root) => {
    const cityStateZipRe = /^([A-Za-z .'-]+),\s*([A-Z]{2})\s*(\d{5})$/;
    const walker = document.createTreeWalker(root, NodeFilter.SHOW_TEXT);
    let node;
    while ((node = walker.nextNode())) {
      const text = node.nodeValue;
      if (!text || !/[A-Za-z]/.test(text)) continue;
      if (text.includes('Sold Price:')) { node.nodeValue = text.replace('Sold Price:', '').trim(); continue; }
      const filterCountMatch = text.match(/^(Price|Beds|Baths|More)\s*\(\d+\)$/);
      if (filterCountMatch) { node.nodeValue = filterCountMatch[1]; continue; }
      if (node.parentElement && /^\$[\d,]+\+?$/.test(text.trim())) node.parentElement.style.setProperty('font-weight', '700', 'important');
      const trimmed = text.trim();
      const cz = trimmed.match(cityStateZipRe);
      if (cz && trimmed === trimmed.toUpperCase()) {
        const fixedCity = cz[1].toLowerCase().replace(/\b\w/g, (c) => c.toUpperCase());
        node.nodeValue = text.replace(trimmed, fixedCity + ', ' + cz[2] + ' ' + cz[3]);
        continue;
      }
      let changed = false;
      const fixedText = text.replace(/\b([A-Za-z]{2,6})\b\.?/g, (word, base) => {
        const full = this._ihfStreetSuffixes[base.toUpperCase()];
        if (full) { changed = true; return full; }
        return word;
      });
      if (changed) node.nodeValue = fixedText;
    }
    const ihfDirectText = (el) => { let s = ''; el.childNodes.forEach((n) => { if (n.nodeType === 3) s += n.nodeValue; }); return s.trim(); };

        el.style.setProperty('font-weight', '700', 'important');
      }

      const style = document.createElement('style');
      style.setAttribute('data-ihf-font-fix', '1');
      const scopeSel = root === document ? '#ihf-listing-detail, #ihf-listing-detail *' : ':host, *';
      style.textContent = scopeSel + " { --rh-font: 'Montserrat', system-ui, sans-serif !important; font-family: 'Montserrat', system-ui, sans-serif !important; font-weight: 400 !important; }"

        + ".ihf-listing-result-cell, [class*='listing-card' i], [class*='result-cell' i], [class*='gallery-card' i] { border: none !important; box-shadow: none !important; background: none !important; background-color: transparent !important; }"

          k.style.setProperty('flex', '1 1 100%', 'important');
          k.style.setProperty('width', '100%', 'important');
          k.style.setProperty('max-width', '100%', 'important');
        });
      }
    }
    if (!this._ihfTitleObserverBound) {
      this._ihfTitleObserverBound = true;
      const fixTitle = () => {
        if (this._ihfTitleFixed) return;
        const t = document.title;
        const suffixes = 'Street|St|Avenue|Ave|Road|Rd|Drive|Dr|Lane|Ln|Court|Ct|Way|Boulevard|Blvd|Place|Pl|Terrace|Ter|Circle|Cir|Parkway|Pkwy|Trail|Trl|Loop|Highway|Hwy|Square|Sq|Crossing|Xing|Point|Pt';
        const suffixRe = new RegExp('\\b(' + suffixes + ')\\b\\s+([A-Za-z .\'-]+?),\\s*([A-Za-z]{2})\\b', 'i');
        let matched = false;
        let fixed = t.replace(suffixRe, (m, suf, city, st) => {
          matched = true;
          const properSuf = suf.charAt(0).toUpperCase() + suf.slice(1).toLowerCase();
          const properCity = city.toLowerCase().replace(/\b\w/g, (c) => c.toUpperCase());
          return properSuf + ' | ' + properCity + ', ' + st.toUpperCase();
        });
        if (!matched) {
          fixed = t.replace(/\b([A-Z]{2,}(?:[ .'-][A-Z]{2,})*),\s*([A-Z]{2})\b/g, (m, city, st) => { matched = true; return '| ' + city.toLowerCase().replace(/\b\w/g, (c) => c.toUpperCase()) + ', ' + st; });
        }
        const isFallback = /\{listingAddress\}/.test(fixed);
        if (isFallback) fixed = 'Home Search | Jackson Kesecker';
        if (fixed !== t) document.title = fixed;
        if (matched || isFallback) this._ihfTitleFixed = true;
      };
      const titleEl = document.querySelector('title');
      if (titleEl) new MutationObserver(fixTitle).observe(titleEl, { childList: true, characterData: true, subtree: true });
      fixTitle();
    }
  };
  _ihfFixFormValues = (root) => {
    root.querySelectorAll('textarea').forEach((ta) => {
      if (ta.dataset.ihfValueFixed || !ta.value) return;
      let fixed = ta.value.replace(/\b([A-Za-z .'-]+),\s*([A-Z]{2})\s*(\d{5})\b/g, (m, city, st, zip) => {
        if (city !== city.toUpperCase()) return m;
        return city.toLowerCase().replace(/\b\w/g, (c) => c.toUpperCase()) + ', ' + st + ' ' + zip;
      });
      fixed = fixed.replace(/\b([A-Za-z]{2,6})\b\.?/g, (word, base) => this._ihfStreetSuffixes[base.toUpperCase()] || word);
      if (fixed !== ta.value) { ta.value = fixed; ta.dataset.ihfValueFixed = '1'; }
    });
  };
  _ihfMoveResultsCount = (root) => {
    const leaves = Array.from(root.querySelectorAll('*'));
    const directText = (el) => { let s = ''; el.childNodes.forEach((n) => { if (n.nodeType === 3) s += n.nodeValue; }); return s.trim(); };
    const resultsEl = leaves.find((el) => !el.children.length && /^\d[\d,]*\s*results?$/i.test(directText(el)));
    const mapEl = leaves.find((el) => !el.children.length && /^map$/i.test(directText(el)));
    if (!resultsEl || !mapEl || !mapEl.parentElement) return;
    const resultsRow = resultsEl.parentElement;
    if (resultsRow && resultsRow !== mapEl.parentElement) resultsRow.style.setProperty('display', 'none', 'important');
    let clone = root.querySelector('[data-ihf-results-clone]');
    if (!clone) {
      clone = document.createElement('span');
      clone.setAttribute('data-ihf-results-clone', '1');
      clone.style.marginLeft = '12px';
      clone.style.fontSize = '14px';
      clone.style.color = 'inherit';
      clone.style.fontFamily = 'inherit';
      clone.style.whiteSpace = 'nowrap';
    }
    const t = directText(resultsEl);
    if (clone.textContent !== t) clone.textContent = t;
    if (clone.parentElement !== mapEl.parentElement || clone.previousElementSibling !== mapEl) {
      mapEl.parentElement.insertBefore(clone, mapEl.nextSibling);
    }
  };
  _ihfReplaceMap = (root) => {
    const mapSection = root.querySelector('.listing-map');
    if (!mapSection || mapSection.dataset.ihfMapReplaced) return;
    const mapboxEl = mapSection.querySelector('[class*="mapboxgl" i], canvas');
    if (!mapboxEl) return;
    let container = mapboxEl;
    while (container.parentElement && container.parentElement !== mapSection && container.parentElement.children.length === 1) {
      container = container.parentElement;
    }
    const addr1 = root.querySelector('.listing-address-1');
    const addr2 = root.querySelector('.listing-address-2');
    const address = [addr1, addr2].filter(Boolean).map((el) => (el.textContent || '').trim()).filter(Boolean).join(', ');
    if (!address) return;
    mapSection.dataset.ihfMapReplaced = '1';
    const iframe = document.createElement('iframe');
    iframe.src = 'Listing Map.html?address=' + encodeURIComponent(address);
    iframe.style.cssText = 'width:100%;height:' + (container.getBoundingClientRect().height || 450) + 'px;border:none;display:block;';
    container.style.setProperty('display', 'none', 'important');
    container.parentElement.insertBefore(iframe, container);
  };
  _ihfTraceHearts = (root) => {
    root.querySelectorAll('.ihf-listing-result-badge-fav').forEach((btn) => {
      if (btn.dataset.heartTraced) return;
      const svg = btn.querySelector('svg');
      if (!svg || !svg.querySelector('path')) return;
      btn.dataset.heartTraced = '1';
      if (getComputedStyle(btn).position === 'static') btn.style.position = 'relative';
      const clone = svg.cloneNode(true);
      clone.classList.add('heart-trace-clone');
      clone.style.position = 'absolute';
      clone.style.inset = '0';
      clone.style.pointerEvents = 'none';
      clone.style.overflow = 'visible';
      clone.querySelectorAll('path').forEach((p) => {
        let len = 40;
        try { len = p.getTotalLength(); } catch (e) {}
        p.style.fill = 'none';
        p.style.stroke = '#e53935';
        p.style.strokeWidth = '2';
        p.style.strokeDasharray = String(len);
        p.style.strokeDashoffset = String(len);
      });
      svg.insertAdjacentElement('afterend', clone);
    });
  };
  _ihfFixCloseButtons = (root) => {
    root.querySelectorAll('.MuiIconButton-root').forEach((btn) => {
      if (btn._ihfCloseHoverBound) return;
      const svg = btn.querySelector('svg');
      if (!svg || !svg.querySelector('line')) return;
      btn._ihfCloseHoverBound = true;
      btn.addEventListener('mouseenter', () => { svg.style.setProperty('color', '#999999', 'important'); svg.querySelectorAll('line').forEach((l) => l.style.setProperty('stroke', '#999999', 'important')); });
      btn.addEventListener('mouseleave', () => { svg.style.removeProperty('color'); svg.querySelectorAll('line').forEach((l) => l.style.removeProperty('stroke')); });
    });
  };
  _ihfFixAllShadowRoots = () => {
    try { this._ihfFixTextInRoot(document); } catch (e) {}
    try { this._ihfFixCloseButtons(document); } catch (e) {}
    if (!this._ihfShadowRootsObserved) this._ihfShadowRootsObserved = new WeakSet();
    document.querySelectorAll('*').forEach((el) => {
      if (el.shadowRoot) {
        try { this._ihfFixTextInRoot(el.shadowRoot); } catch (e) {}
        try { this._ihfFixCloseButtons(el.shadowRoot); } catch (e) {}
        if (!this._ihfShadowRootsObserved.has(el.shadowRoot)) {
          this._ihfShadowRootsObserved.add(el.shadowRoot);
          new MutationObserver(() => this._ihfFixAllShadowRoots()).observe(el.shadowRoot, { childList: true, subtree: true });
        }
      }
    });
  };
  _ihfStartCaseFix = () => {
    if (this._ihfCaseFixStarted) return;
    this._ihfCaseFixStarted = true;
    if (!document.getElementById('ihf-modal-fix')) {
      const s = document.createElement('style');
      s.id = 'ihf-modal-fix';
      s.textContent = "div.ihf-overlay-container { position: fixed !important; top: 0 !important; left: 0 !important; }"
        + ".ui-typography-h3 { text-align: center !important; font-size: 22px !important; }"
        + ".ui-typography-body1 { text-align: center !important; font-size: 14px !important; }"
        + ".ui-outlined-input { border: none !important; border-bottom: 1px solid #cccccc !important; border-radius: 0 !important; box-shadow: none !important; padding-left: 4px !important; }"
        + ".ui-outlined-input-input { font-size: 14px !important; padding: 8px 4px !important; }"
        + ".ui-outlined-input fieldset { border: none !important; }"
        + ".ihf-email-field, .ui-form-control { max-width: 320px !important; margin-left: auto !important; margin-right: auto !important; }"
        + "[aria-label*='close' i], button[aria-label*='close' i] svg, .MuiDialog-root [aria-label*='close' i], .MuiModal-root [aria-label*='close' i] { transition: color 0.2s ease, opacity 0.2s ease !important; }"
        + "[aria-label*='close' i]:hover, button[aria-label*='close' i]:hover svg, .MuiDialog-root [aria-label*='close' i]:hover, .MuiModal-root [aria-label*='close' i]:hover { color: #999999 !important; fill: #999999 !important; opacity: 0.65 !important; }"
        + ".MuiDialog-root .MuiIconButton-root, .MuiModal-root .MuiIconButton-root, .MuiDialog-root button svg, .MuiModal-root button svg { transition: color 0.2s ease, opacity 0.2s ease, fill 0.2s ease !important; }"
        + ".MuiDialog-root .MuiIconButton-root:hover, .MuiModal-root .MuiIconButton-root:hover, .MuiDialog-root button:hover svg, .MuiModal-root button:hover svg { color: #999999 !important; fill: #999999 !important; opacity: 0.65 !important; }"
        + ".MuiDialog-paper .MuiIconButton-root svg, .MuiDialog-paper .MuiIconButton-root svg line { transition: color 0.2s ease, stroke 0.2s ease, opacity 0.2s ease !important; }"
        + ".MuiDialog-paper .MuiIconButton-root:hover svg, .MuiDialog-paper .MuiIconButton-root:hover svg line { color: #999999 !important; stroke: #999999 !important; opacity: 0.65 !important; }";
      document.head.appendChild(s);
    }
    if (!this._ihfMo) {
      this._ihfMo = new MutationObserver(() => this._ihfFixAllShadowRoots());
      this._ihfMo.observe(document.body, { childList: true, subtree: true });
    }
    this._ihfFixAllShadowRoots();
  };
  ihfListingDetailRef = (node) => {
    if (!node || node.dataset.ihfMounted) return;
    const doMount = () => {
      if (node.dataset.ihfMounted) return;
      node.dataset.ihfMounted = '1';
      node.appendChild(window.ihfKestrel.render());
      this._ihfStartCaseFix();
    };
    if (window.ihfKestrel && window.ihfKestrel.render) { doMount(); return; }
    const ks = document.querySelector('script[src*="ihf-kestrel.js"]');
    if (ks) ks.addEventListener('load', doMount, { once: true });
  };
  openContactModal = (e) => { if (e) e.preventDefault(); if (window.openKeseckerContactModal) window.openKeseckerContactModal(); };
  togglePhonePopup = () => this.setState(s => ({ isPhoneOpen: !s.isPhoneOpen }));
  onPhoneClose = () => this.setState({ isPhoneOpen: false });
  renderVals() {
    return {
      ihfListingDetailRef: this.ihfListingDetailRef,
      openContactModal: this.openContactModal,
      isPhoneOpen: this.state.isPhoneOpen, togglePhonePopup: this.togglePhonePopup, onPhoneClose: this.onPhoneClose,
      phonePopoverStyle: this.state.isPhoneOpen ? 'opacity:1;visibility:visible;transform:translateY(0);transition:opacity 0.3s ease,transform 0.3s ease;' : 'opacity:0;visibility:hidden;transform:translateY(8px);transition:opacity 0.3s ease,transform 0.3s ease;',
    };
  }
}

</script>
</body>
