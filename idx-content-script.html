<script>
(function () {
  function getRoots() {
    var roots = [];
    document.querySelectorAll('div.ihf-container, div.ihf-overlay-container').forEach(function (h) { if (h.shadowRoot) roots.push(h.shadowRoot); });
    return roots;
  }
  function fixCase(text) {
    var m = text.match(/,\s*([A-Za-z]{2})\s*\d{5}/);
    var state = m ? m[1].toUpperCase() : null;
    var result = text.toLowerCase().replace(/\b[a-z]/g, function (c) { return c.toUpperCase(); });
    if (state) result = result.replace(/\b[A-Za-z]{2}\b(?=\s*\d{5})/, state);
    return result;
  }
  var running = false;
  function processAll() {
    if (running) return;
    running = true;
    try {
      getRoots().forEach(function (root) {
        root.querySelectorAll('.ihf-gallery-street-name').forEach(function (wrap) {
          var p = wrap.querySelector('p') || wrap;
          var fixed = fixCase(p.textContent);
          if (p.textContent !== fixed) p.textContent = fixed;
        });
      });
    } finally { running = false; }
  }
  var observed = new WeakSet();
  var timer = null;
  function schedule() { if (timer) return; timer = setTimeout(function () { timer = null; processAll(); }, 120); }
  function watch() {
    getRoots().forEach(function (root) {
      if (observed.has(root)) return;
      observed.add(root);
      new MutationObserver(schedule).observe(root, { childList: true, subtree: true, characterData: true });
    });
  }
  var tries = 0;
  var init = setInterval(function () {
    tries++;
    watch();
    processAll();
    if (tries > 150) clearInterval(init);
  }, 200);
  console.log('[ihf-content] loaded on', location.pathname);
})();
(function () {
  if (window.__ihfListingFixesLoaded) return;
  var p = location.pathname.replace(/\/+$/, '');
  if (p !== '/listing') return;
  window.__ihfListingFixesLoaded = true;
  class IhfListingFixes {
_ihfStreetSuffixes = { RD:'Road', ST:'Street', AVE:'Avenue', DR:'Drive', LN:'Lane', CT:'Court', WAY:'Way', BLVD:'Boulevard', PL:'Place', CIR:'Circle', TER:'Terrace', PKWY:'Parkway', HWY:'Highway', LOOP:'Loop', TRL:'Trail', SQ:'Square' };
_ihfRunGuarded = (key, fn) => {
if (this._ihfRunning) { this._ihfDirty = true; return; }
if (!this._ihfPending) this._ihfPending = new Map();
this._ihfPending.set(key, fn);
if (this._ihfTimer) return;
this._ihfTimer = setTimeout(() => {
this._ihfTimer = null;
const now = Date.now();
this._ihfRunLog = (this._ihfRunLog || []).filter((t) => now - t < 5000);
if (this._ihfTripped || this._ihfRunLog.length > 40) {
if (!this._ihfTripped) {
this._ihfTripped = true;
console.warn('[ihf] fix loop detected - pausing auto-fixes for 5s');
setTimeout(() => { this._ihfTripped = false; this._ihfRunLog = []; this._ihfRunGuarded('all', () => this._ihfFixAllShadowRoots()); }, 5000);
}
this._ihfPending.clear();
return;
}
this._ihfRunLog.push(now);
const fns = Array.from(this._ihfPending.values());
this._ihfPending.clear();
this._ihfRunning = true;
try { fns.forEach((f) => { try { f(); } catch (e) { console.error('[ihf]', e); } }); }
finally {
Promise.resolve().then(() => {
this._ihfRunning = false;
if (this._ihfDirty) { this._ihfDirty = false; setTimeout(() => this._ihfRunGuarded('all', () => this._ihfFixAllShadowRoots()), 300); }
});
}
}, 80);
};
_ihfBuildLoopCarousel = (root) => {
const carousel = root.querySelector('.listing-photo-carousel');
if (!carousel || carousel.querySelector('[data-ihf-loop]')) return;
const nativeImgs = Array.from(carousel.querySelectorAll('li img')).filter((im) => !im.closest('[data-ihf-loop]'));
if (nativeImgs.length < 2 || nativeImgs.some((im) => !(im.currentSrc || im.src))) return;
const srcs = nativeImgs.map((im) => im.currentSrc || im.src);
const left = carousel.querySelector('.listing-photo-carousel-left');
const right = carousel.querySelector('.listing-photo-carousel-right');
const n = srcs.length;
const CL = 2;
const all = srcs.slice(n - CL).concat(srcs, srcs.slice(0, CL));
const view = document.createElement('div');
view.dataset.ihfLoop = '1';
view.dataset.ihfOwn = '1';
view.style.cssText = 'overflow:hidden;background:#ffffff;touch-action:pan-y;cursor:grab;';
[['position', 'absolute'], ['top', '0'], ['left', '0'], ['right', '0'], ['bottom', '0'], ['width', '100%'], ['height', '100%'], ['margin', '0'], ['padding', '0'], ['z-index', '5']].forEach(([k, v]) => view.style.setProperty(k, v, 'important'));
const track = document.createElement('div');
track.style.cssText = 'display:flex;height:100%;width:100%;will-change:transform;';
all.forEach((s, k) => {
const slide = document.createElement('div');
slide.style.cssText = 'flex:0 0 60%;width:60%;min-width:60%;max-width:60%;height:100%;overflow:hidden;';
const im = document.createElement('img');
im.src = s;
im.alt = '';
im.draggable = false;
im.style.cssText = 'width:100%;height:100%;object-fit:cover;display:block;user-select:none;';
slide.appendChild(im);
slide.addEventListener('click', () => {
if (view.dataset.dragged === '1') return;
const real = ((k - CL) % n + n) % n;
const target = nativeImgs.find((x) => (x.currentSrc || x.src) === srcs[real]) || nativeImgs[real];
if (target) (target.closest('button, a, [role="button"]') || target).click();
});
track.appendChild(slide);
});
view.appendChild(track);
carousel.appendChild(view);
carousel.querySelectorAll('[data-ihf-heart]').forEach((el) => { el.style.setProperty('position', 'absolute', 'important'); el.style.setProperty('z-index', '50', 'important'); });
carousel.querySelectorAll('[data-ihf-badge-cloned]').forEach((el) => { el.style.setProperty('position', 'absolute', 'important'); el.style.setProperty('top', '16px', 'important'); el.style.setProperty('left', '16px', 'important'); el.style.setProperty('z-index', '50', 'important'); });
[left, right].forEach((el) => { if (el) el.style.setProperty('visibility', 'hidden', 'important'); });
const mkArrow = (side) => {
const btn = document.createElement('button');
btn.type = 'button';
btn.setAttribute('aria-label', side === 'l' ? 'Previous photo' : 'Next photo');
btn.style.cssText = 'position:absolute;top:50%;' + (side === 'l' ? 'left:16px;' : 'right:16px;') + 'transform:translateY(-50%);z-index:40;width:48px;height:48px;border-radius:50%;border:none;background:rgba(0,0,0,0.45);color:#ffffff;display:flex;align-items:center;justify-content:center;cursor:pointer;transition:background 0.2s ease,color 0.2s ease;';
btn.innerHTML = side === 'l'
? '<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg>'
: '<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 5l7 7-7 7"/></svg>';
btn.addEventListener('mouseenter', () => { btn.style.background = '#ffffff'; btn.style.color = '#1a1a1a'; });
btn.addEventListener('mouseleave', () => { btn.style.background = 'rgba(0,0,0,0.45)'; btn.style.color = '#ffffff'; });
btn.addEventListener('pointerdown', (e) => e.stopPropagation());
btn.addEventListener('click', (e) => { e.preventDefault(); e.stopPropagation(); go(side === 'l' ? -1 : 1); });
view.appendChild(btn);
};
carousel.querySelectorAll('[data-ihf-heart], [data-ihf-badge]').forEach((el) => el.style.setProperty('z-index', '30', 'important'));
let i = CL;
const w = () => view.getBoundingClientRect().width;
const place = (anim, extra) => {
track.style.setProperty('transition', anim ? 'transform 0.45s cubic-bezier(0.25, 0.8, 0.25, 1)' : 'none', 'important');
track.style.setProperty('transform', 'translateX(calc(' + (20 - i * 60) + '% + ' + (extra || 0) + 'px))', 'important');
};
let busy = false;
let settleTimer = null;
const settle = () => {
clearTimeout(settleTimer);
if (i >= n + CL) { i -= n; place(false); }
if (i < CL) { i += n; place(false); }
busy = false;
};
const go = (d) => {
if (busy) return;
busy = true;
i += d;
place(true);
clearTimeout(settleTimer);
settleTimer = setTimeout(settle, 500);
};
track.addEventListener('transitionend', (e) => { if (e.target === track) settle(); });
mkArrow('l');
mkArrow('r');
view.tabIndex = 0;
view.addEventListener('keydown', (e) => { if (e.key === 'ArrowLeft') go(-1); if (e.key === 'ArrowRight') go(1); });
let sx = null, dx = 0;
view.addEventListener('pointerdown', (e) => { if (busy || e.button !== 0 || e.target.closest('button')) return; sx = e.clientX; dx = 0; view.dataset.dragged = '0'; view.style.cursor = 'grabbing'; });
window.addEventListener('pointermove', (e) => { if (sx === null) return; dx = e.clientX - sx; if (Math.abs(dx) > 5) view.dataset.dragged = '1'; place(false, dx); });
window.addEventListener('pointerup', () => {
if (sx === null) return;
sx = null; view.style.cursor = 'grab';
if (Math.abs(dx) < 6) { place(false); return; }
if (dx < -w() * 0.12) go(1); else if (dx > w() * 0.12) go(-1); else place(true);
setTimeout(() => { view.dataset.dragged = '0'; }, 50);
});
window.addEventListener('resize', () => place(false));
place(false);
requestAnimationFrame(() => place(false));
};
_ihfFixCarouselWrap = (root) => {
const carousel = root.querySelector('.listing-photo-carousel');
if (!carousel || carousel.dataset.ihfWrapFix) return;
const left = carousel.querySelector('.listing-photo-carousel-left');
const right = carousel.querySelector('.listing-photo-carousel-right');
if (!left || !right) return;
carousel.dataset.ihfWrapFix = '1';
const handle = (dir) => () => {
const slides = Array.from(carousel.querySelectorAll('ul.slider > li.slide'));
if (slides.length < 2) return;
const cur = slides.findIndex((s) => s.classList.contains('selected'));
const wraps = (dir < 0 && cur <= 0) || (dir > 0 && cur >= slides.length - 1);
if (!wraps) return;
const ul = carousel.querySelector('ul.slider');
const wrapper = carousel.querySelector('.slider-wrapper') || ul;
if (!ul) return;
ul.style.setProperty('transition', 'none', 'important');
ul.style.setProperty('transition-duration', '0ms', 'important');
wrapper.style.setProperty('transition', 'none', 'important');
wrapper.style.setProperty('opacity', '0.25', 'important');
setTimeout(() => {
wrapper.style.setProperty('transition', 'opacity 0.3s ease', 'important');
wrapper.style.setProperty('opacity', '1', 'important');
setTimeout(() => { ul.style.removeProperty('transition'); ul.style.removeProperty('transition-duration'); }, 350);
}, 30);
};
left.addEventListener('click', handle(-1), true);
right.addEventListener('click', handle(1), true);
};
_ihfAddDaysOnMarket = (root) => {
const heading = Array.from(root.querySelectorAll('*')).find((el) => el.children.length === 0 && /^additional information$/i.test((el.textContent || '').trim()));
if (!heading) return;
let section = heading.parentElement;
for (let i = 0; i < 6 && section && !this._ihfFindPairWrappers(section).length; i++) section = section.parentElement;
if (!section || section.dataset.ihfDomAdded) return;
const pairs = this._ihfFindPairWrappers(section);
if (!pairs.length) return;
const all = this._ihfFindPairWrappers(root);
if (all.some((w) => /days on (market|site)|^dom$/i.test((w.children[0].textContent || '').trim()))) { section.dataset.ihfDomAdded = '1'; return; }
let days = null;
const dateW = all.find((w) => /(list(ing)?|on market)\s*date|date listed/i.test((w.children[0].textContent || '').trim()));
if (dateW) {
const d = new Date((dateW.children[1].textContent || '').trim());
if (!isNaN(d)) days = Math.max(0, Math.floor((Date.now() - d.getTime()) / 86400000));
}
if (days === null) {
const leaf = Array.from(root.querySelectorAll('*')).find((el) => el.children.length === 0 && /\b(\d+)\s+days?\s+(on (market|site)|ago)\b/i.test(el.textContent || ''));
if (leaf) days = parseInt((leaf.textContent.match(/(\d+)\s+days?/i) || [])[1], 10);
}
if (days === null || isNaN(days)) return;
section.dataset.ihfDomAdded = '1';
const tpl = pairs[0];
const pair = tpl.cloneNode(true);
pair.children[0].textContent = 'Days on Market';
pair.children[1].textContent = days + (days === 1 ? ' day' : ' days');
tpl.parentElement.insertBefore(pair, tpl);
};
_ihfSetSavedUI = (root, on) => {
const heart = root.querySelector('[data-ihf-heart]');
if (heart) {
heart.dataset.ihfLocalSaved = on ? '1' : '0';
const p = heart.querySelector('path');
if (p) { p.setAttribute('fill', on ? '#e53935' : 'none'); p.setAttribute('stroke', on ? '#e53935' : '#ffffff'); }
}
const sb = root.querySelector('.ihf-save-btn');
if (sb) { sb.dataset.saved = on ? '1' : '0'; const s = sb.querySelector('span'); if (s) s.textContent = on ? 'Saved' : 'Save'; }
};
_ihfEnsureBtnStyle = (root) => {

if (host.querySelector('style[data-ihf-btn-style]')) return;
const st = document.createElement('style');
st.dataset.ihfBtnStyle = '1';
st.textContent = '.ihf-invert-btn{font-family:inherit;font-size:14px;padding:8px 16px;border-radius:6px;border:none;outline:none;box-shadow:none;cursor:pointer;background:#1a1a1a;color:#ffffff;display:inline-flex;align-items:center;gap:8px;line-height:1.2;transition:background .2s ease,color .2s ease;}'
+ '.ihf-invert-btn:hover{background:#ffffff;color:#1a1a1a;}'
+ '.ihf-save-btn path{stroke-dasharray:100;stroke-dashoffset:0;transition:fill .2s ease,stroke .2s ease;}'
+ '.ihf-save-btn:hover path{animation:ihfHeartTrace .7s ease forwards;stroke:#e53935;}'
+ '.ihf-save-btn[data-saved="1"] path{fill:#e53935;stroke:#e53935;}'
+ '@keyframes ihfHeartTrace{from{stroke-dashoffset:100}to{stroke-dashoffset:0}}'
+ '.ihf-share-btn svg{transition:transform .25s ease;}'
+ '.ihf-share-btn:hover svg{transform:translateY(-2px);}';

_ihfBuildActionButtons = (root, row) => {
this._ihfEnsureBtnStyle(root);
const all = Array.from(root.querySelectorAll('*'));
const pick = (re) => {
const m = all.filter((el) => re.test((el.textContent || '').trim()) && !el.closest('[role="dialog"], [data-ihf-own]'));
return m.length ? m.reduce((a, b) => (a.querySelectorAll('*').length <= b.querySelectorAll('*').length ? a : b)) : null;
};
const clickNative = (re) => { const b = pick(re); const c = b && (b.closest('button, a, [role="button"]') || b); if (c) c.click(); };
const save = document.createElement('button');
save.type = 'button';
save.className = 'ihf-invert-btn ihf-save-btn';
save.dataset.ihfOwn = '1';
save.innerHTML = '<svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path pathLength="100" d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/></svg><span>Save</span>';
const cardHeart = root.querySelector('.ihf-listing-result-badge-fav svg, [class*="badge-fav" i] svg');
if (cardHeart) {
const vb = cardHeart.getAttribute('viewBox');
const cp = Array.from(cardHeart.querySelectorAll('path')).map((x) => x.getAttribute('d')).filter(Boolean).sort((x, y) => y.length - x.length)[0];
const sp = save.querySelector('svg');
if (vb) sp.setAttribute('viewBox', vb);
if (cp) sp.querySelector('path').setAttribute('d', cp);
}
save.addEventListener('click', (e) => { e.preventDefault(); e.stopPropagation(); clickNative(/^(save|saved)$/i); this._ihfSetSavedUI(root, save.dataset.saved !== '1'); });
const share = document.createElement('button');
share.type = 'button';
share.className = 'ihf-invert-btn ihf-share-btn';
share.dataset.ihfOwn = '1';
share.innerHTML = '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12v7a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-7"/><path d="M16 6l-4-4-4 4"/><path d="M12 2v13"/></svg><span>Share</span>';
share.addEventListener('click', (e) => { e.preventDefault(); e.stopPropagation(); clickNative(/^share$/i); });
row.appendChild(save);
row.appendChild(share);
const nativeSave = pick(/^(save|saved)$/i);
if (nativeSave && /^saved$/i.test((nativeSave.textContent || '').trim())) this._ihfSetSavedUI(root, true);
};
_ihfBuildOpenHouses = (root) => {
const dayRe = /^(Mon|Tues|Wednes|Thurs|Fri|Satur|Sun)day,?\s+[A-Za-z]{3,9}\.?\s+\d{1,2}$/i;
const timeRe = /\d{1,2}:\d{2}\s*(AM|PM)/i;
const dates = Array.from(root.querySelectorAll('*')).filter((el) => el.children.length === 0 && dayRe.test((el.textContent || '').trim()) && !el.closest('.similar-listings, [class*="listing-result" i], [role="dialog"], [data-ihf-own]'));
if (!dates.length) return;
let c = dates[0].parentElement;
while (c && !dates.every((d) => c.contains(d))) c = c.parentElement;
if (!c) return;
if (dates.length === 1) {
let blk = dates[0];
const hasTime = (x) => Array.from(x.querySelectorAll('*')).some((el) => el.children.length === 0 && /\d{1,2}:\d{2}\s*(AM|PM)/i.test(el.textContent || ''));
while (blk.parentElement && !(hasTime(blk) && blk.querySelector('svg, img'))) blk = blk.parentElement;
while (blk.parentElement && blk.parentElement.children.length === 1 && !blk.parentElement.classList.contains('listing-section')) blk = blk.parentElement;
c = blk.parentElement && !blk.parentElement.classList.contains('listing-section') && !blk.parentElement.querySelector('.listing-photo-carousel, .listing-description, .features') ? blk.parentElement : blk;
}
if (!c || c.classList.contains('listing-section') || c.querySelector('.listing-photo-carousel, .listing-description, .features')) return;
while (c.parentElement && c.parentElement.children.length === 1 && !c.parentElement.classList.contains('listing-section')) c = c.parentElement;
c.dataset.ihfOh = '1';
if (c.parentElement) c.parentElement.dataset.ihfOh = '1';
let up = c;
for (let k = 0; k < 10 && up && !up.classList.contains('listing-section'); k++) { up.dataset.ihfOh = '1'; up = up.parentElement; }
const items = dates.map((d) => { let it = d; while (it.parentElement && it.parentElement !== c && c.contains(it.parentElement) && !dates.some((o) => o !== d && it.parentElement.contains(o))) it = it.parentElement; return it; });
c.style.setProperty('display', 'block', 'important');
c.style.setProperty('width', '100%', 'important');
c.style.setProperty('margin-left', '0', 'important');
c.style.setProperty('margin-right', '0', 'important');
c.style.setProperty('padding', '0', 'important');
const sig = dates.map((d) => (d.textContent || '').trim()).join('|');
let own = c.querySelector(':scope > [data-ihf-oh-list]');
if (!own || own.dataset.sig !== sig) {
if (own) own.remove();
own = document.createElement('div');
own.dataset.ihfOwn = '1';
own.dataset.ihfOhList = '1';
own.dataset.sig = sig;
own.style.cssText = 'display:flex;flex-direction:column;align-items:flex-start;gap:16px;width:100%;margin:0;padding:0;';
const fs = getComputedStyle(dates[0]).fontSize || '16px';
items.forEach((it, idx) => {
const d = dates[idx];
const tEl = Array.from(it.querySelectorAll('*')).find((el) => el.children.length === 0 && timeRe.test(el.textContent || ''));
const row = document.createElement('div');
row.style.cssText = 'display:flex;align-items:center;gap:14px;font-size:' + fs + ';line-height:1.4;color:#1a1a1a;';
row.innerHTML = '<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" style="flex:0 0 auto;"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/></svg>';
const ds = document.createElement('span');
ds.textContent = (d.textContent || '').trim();
row.appendChild(ds);
if (tEl) {
const sep = document.createElement('span');
sep.textContent = '\u00a0\u00a0\u2013\u00a0\u00a0';
sep.style.whiteSpace = 'pre';
const ts = document.createElement('span');
ts.textContent = (tEl.textContent || '').trim();
ts.style.setProperty('font-weight', '700', 'important');
row.appendChild(sep);
row.appendChild(ts);
}
own.appendChild(row);
});
c.insertBefore(own, c.firstChild);
}
items.forEach((it) => { if (it !== own) it.style.setProperty('display', 'none', 'important'); });
Array.from(root.querySelectorAll('*')).forEach((el) => {
if (el.closest('.similar-listings, [class*="listing-result" i], .listing-photo-carousel, [data-ihf-own]')) return;
const r = el.getBoundingClientRect();
if (!r.width || r.width > 14 || r.height > 14 || el.children.length) return;
const bg = getComputedStyle(el).backgroundColor.match(/\d+/g);
if (bg && +bg[1] > 150 && +bg[0] < 120 && +bg[2] < 140) el.style.setProperty('display', 'none', 'important');
});
let head = c.parentElement && c.parentElement.querySelector(':scope > [data-ihf-oh-head]');
if (!head) {
head = document.createElement('div');
head.dataset.ihfOwn = '1';
head.dataset.ihfOhHead = '1';
const refH = Array.from(root.querySelectorAll('h2, h3')).find((h) => /^(about this property|property features)$/i.test((h.textContent || '').trim()));
const rcs = refH ? getComputedStyle(refH) : null;
const h2 = document.createElement('h2');
h2.textContent = 'Open Houses';
h2.style.cssText = 'margin:0 0 14px;text-align:left;color:#1a1a1a;line-height:1.25;font-weight:700;font-size:' + (rcs ? rcs.fontSize : '26px') + ';';
const line = document.createElement('div');
let divBorder = '1px solid rgba(0,0,0,0.25)';
const locH = Array.from(root.querySelectorAll('h2, h3, h4')).find((h) => /^location information$/i.test((h.textContent || '').trim()));
if (locH) {
const scope = locH.parentElement && locH.parentElement.parentElement ? locH.parentElement.parentElement : locH.parentElement;
const cand = [locH, locH.parentElement].concat(Array.from(scope.querySelectorAll('*'))).find((x) => x && parseFloat(getComputedStyle(x).borderBottomWidth) > 0);
if (cand) { const s = getComputedStyle(cand); divBorder = s.borderBottomWidth + ' ' + s.borderBottomStyle + ' ' + s.borderBottomColor; }
else { const hr = scope.querySelector('hr'); if (hr) { const s = getComputedStyle(hr); divBorder = (parseFloat(s.borderTopWidth) ? s.borderTopWidth + ' solid ' + s.borderTopColor : '1px solid ' + s.backgroundColor); } }
}
line.style.cssText = 'height:0;border-top:' + divBorder + ';width:100%;';
head.appendChild(h2);
head.appendChild(line);
head.style.cssText = 'width:100%;margin:48px 0 20px;';
